name: CI

on:
  push:
    branches: [primary, master, main]
  pull_request:
    branches: [primary, master, main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mock pytest

      - name: Run tests
        working-directory: src
        run: |
          python -m pytest calendly_client_test.py controller_test.py -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.x"

      - name: Install linter
        run: pip install flake8

      - name: Run flake8
        working-directory: src
        run: |
          flake8 calendly_client.py controller.py constants.py helper.py migration.py \
            --max-line-length=150 --count --show-source --statistics

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build workflow artifact
        run: |
          cd src
          zip ../calendly.alfredworkflow . -r \
            --exclude=*.DS_Store* \
            --exclude=*.pyc* \
            --exclude=.pytest* \
            --exclude=*_test.py

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: calendly-alfredworkflow
          path: calendly.alfredworkflow
          retention-days: 30
