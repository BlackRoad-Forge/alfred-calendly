name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mock pytest

      - name: Run tests
        working-directory: src
        run: python -m pytest calendly_client_test.py controller_test.py -v

      - name: Build workflow
        run: |
          cd src
          zip ../calendly.alfredworkflow . -r \
            --exclude=*.DS_Store* \
            --exclude=*.pyc* \
            --exclude=.pytest* \
            --exclude=*_test.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@7b4da11513bf3f43f9999e90eabced41ab8f3c11 # v2.2.1
        with:
          files: calendly.alfredworkflow
          generate_release_notes: true
